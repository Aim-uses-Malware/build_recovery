name: Build AERA Recovery (spes)

# Put this file at .github/workflows/build-aera-spes.yml in any GitHub repo.
# Required secret: AERA_SSH_KEY -> private SSH key of a GitHub account that is a
# member of the (private) AERA-Recovery org. A per-repo deploy key will NOT work.

on:
  workflow_dispatch:
    inputs:
      device_repo:
        description: Device tree repository (owner/name)
        default: Aim-uses-Malware/android_device_spes-AERA
      device_branch:
        description: Device tree branch
        default: main
      kernel_repo:
        description: Kernel source (owner/name), cloned to kernel/xiaomi/spes. Leave empty if the tree uses a prebuilt kernel.
        default: ''
      kernel_branch:
        description: Kernel branch (empty = repo default branch)
        default: ''
      lunch_target:
        description: Lunch target (PRODUCT_NAME in twrp_spes.mk is twrp_spes)
        default: twrp_spes-bp2a-eng
      make_targets:
        description: Targets passed to mka (spes has no recovery partition, recovery is built into boot.img)
        default: adbd recoveryimage bootimage

permissions:
  contents: read

concurrency:
  group: aera-spes
  cancel-in-progress: false

env:
  MANIFEST_URL: git@github.com:AERA-Recovery/android_manifest.git
  MANIFEST_BRANCH: aera-16.0
  DEVICE_PATH: device/xiaomi/spes
  DEVICE_CODENAME: spes

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space and add swap
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 bc rsync lz4 \
            libncurses-dev libssl-dev ccache openssh-client ca-certificates
          # Ubuntu 24.04 blocks unprivileged user namespaces, which breaks the Android sandbox (nsjail)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          git config --global color.ui false

      - name: Check device tree and kernel repos exist
        env:
          DEVICE_REPO: ${{ inputs.device_repo }}
          DEVICE_BRANCH: ${{ inputs.device_branch }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          if ! git ls-remote --exit-code --heads "https://github.com/${DEVICE_REPO}.git" "$DEVICE_BRANCH" > /dev/null; then
            echo "::error::Device tree ${DEVICE_REPO} (branch ${DEVICE_BRANCH}) not found"
            exit 1
          fi
          if [ -n "$KERNEL_REPO" ]; then
            if ! git ls-remote --exit-code "https://github.com/${KERNEL_REPO}.git" "${KERNEL_BRANCH:-HEAD}" > /dev/null; then
              echo "::error::Kernel ${KERNEL_REPO} (${KERNEL_BRANCH:-default branch}) not found or not public"
              exit 1
            fi
          fi

      - name: Set up SSH access to the AERA org
        env:
          AERA_SSH_KEY: ${{ secrets.AERA_SSH_KEY }}
        run: |
          if [ -z "$AERA_SSH_KEY" ]; then
            echo "::error::Secret AERA_SSH_KEY is not set (the AERA-Recovery org is private)."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AERA_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts
          # Fail early with a clear message if the key has no access
          git ls-remote git@github.com:AERA-Recovery/android_bootable_recovery.git "$MANIFEST_BRANCH" \
            || { echo "::error::The SSH key cannot read AERA-Recovery/android_bootable_recovery"; exit 1; }

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync AERA source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aera"
          cd "$GITHUB_WORKSPACE/aera"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1 --no-repo-verify
          synced=0
          for i in 1 2 3; do
            if repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j8; then
              synced=1
              break
            fi
            echo "repo sync failed (attempt $i), retrying in 30s..."
            sleep 30
          done
          test "$synced" = 1

      - name: Clone device tree and kernel
        env:
          DEVICE_REPO: ${{ inputs.device_repo }}
          DEVICE_BRANCH: ${{ inputs.device_branch }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          cd "$GITHUB_WORKSPACE/aera"
          # The path matters: twrp_spes.mk derives the brand from device/<brand>/spes,
          # and vendorsetup.sh only activates inside a directory named "spes".
          git clone --depth=1 -b "$DEVICE_BRANCH" "https://github.com/${DEVICE_REPO}.git" "$DEVICE_PATH"

          if [ -n "$KERNEL_REPO" ]; then
            git clone --depth=1 ${KERNEL_BRANCH:+-b "$KERNEL_BRANCH"} \
              "https://github.com/${KERNEL_REPO}.git" kernel/xiaomi/spes
          fi

          echo "::group::AndroidProducts.mk"; cat "$DEVICE_PATH/AndroidProducts.mk" || true; echo "::endgroup::"
          echo "::group::Kernel / boot lines in BoardConfig.mk"
          grep -nE 'KERNEL|RECOVERY_AS_BOOT|BOOT_HEADER' "$DEVICE_PATH/BoardConfig.mk" || true
          echo "::endgroup::"
          if [ ! -d kernel/xiaomi/spes ]; then
            echo "::warning::kernel/xiaomi/spes is missing. aera_spes.mk builds the kernel in-tree from there unless AERA_FORCE_PREBUILT_KERNEL is set. Use the kernel_repo input if the build fails at the kernel step."
          fi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-aera-spes-${{ github.run_id }}
          restore-keys: |
            ccache-aera-spes-

      - name: Build recovery
        env:
          LUNCH_TARGET: ${{ inputs.lunch_target }}
          MAKE_TARGETS: ${{ inputs.make_targets }}
        run: |
          cd "$GITHUB_WORKSPACE/aera"
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache -M 5G
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          mka $MAKE_TARGETS

      - name: Collect images
        run: |
          OUT="$GITHUB_WORKSPACE/aera/out/target/product/$DEVICE_CODENAME"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for f in recovery.img vendor_boot.img boot.img; do
            if [ -f "$OUT/$f" ]; then
              cp "$OUT/$f" "$GITHUB_WORKSPACE/dist/"
            fi
          done
          cd "$GITHUB_WORKSPACE/dist"
          ls -lh
          ls *.img > /dev/null   # fails the step if nothing was produced
          sha256sum *.img | tee SHA256SUMS.txt

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: aera-recovery-spes-${{ github.run_number }}
          path: ${{ github.workspace }}/dist/
          if-no-files-found: error

      - name: Upload build error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: ${{ github.workspace }}/aera/out/error.log
          if-no-files-found: ignore
