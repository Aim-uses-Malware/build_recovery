name: Build AERA Recovery (spes)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "AERA manifest branch"
        default: "aera-16.0"
      device_branch:
        description: "Device tree branch"
        default: "main"
      lunch_target:
        description: "Lunch target"
        default: "twrp_spes-bp2a-eng"
      build_command:
        description: "Build command"
        default: "mka adbd recoveryimage"
      release:
        description: "Also publish a GitHub release"
        type: boolean
        default: false

env:
  MANIFEST_URL: git@github.com:AERA-Recovery/android_manifest.git
  DEVICE_REPO: https://github.com/Aim-uses-Malware/android_device_spes-AERA.git
  DEVICE_PATH: device/xiaomi/spes
  DEVICE_CODENAME: spes
  CCACHE_DIR: /mnt/ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h / /mnt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            rsync ccache bc lz4 libssl-dev openssh-client
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python

      # The AERA manifest and its forks live in a PRIVATE org, so an SSH key
      # belonging to an account with access is required.
      - name: Set up SSH access to AERA-Recovery
        env:
          SSH_KEY: ${{ secrets.AERA_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret AERA_SSH_KEY is missing (needs access to the AERA-Recovery org)."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts
          ssh -T git@github.com || true   # exits 1 even on success
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Prepare work directory (on /mnt for extra space)
        run: |
          sudo mkdir -p /mnt/build /mnt/ccache
          sudo chown -R "$USER":"$USER" /mnt/build /mnt/ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /mnt/ccache
          key: ccache-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.DEVICE_CODENAME }}-

      - name: Sync AERA source
        working-directory: /mnt/build
        run: |
          repo init -u "$MANIFEST_URL" -b "${{ inputs.manifest_branch }}" --depth=1
          repo sync -c --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune -j$(nproc --all) \
            || repo sync -c --force-sync --no-clone-bundle --no-tags -j4
          df -h /mnt

      - name: Clone device tree
        working-directory: /mnt/build
        run: |
          git clone --depth=1 -b "${{ inputs.device_branch }}" \
            "$DEVICE_REPO" "$DEVICE_PATH"
          ls "$DEVICE_PATH"

      - name: Build recovery
        working-directory: /mnt/build
        run: |
          export USE_CCACHE=1 CCACHE_EXEC=$(command -v ccache)
          ccache -M 20G
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          set +e
          source build/envsetup.sh
          lunch "${{ inputs.lunch_target }}"
          ${{ inputs.build_command }}
          status=$?
          ccache -s
          exit $status

      - name: Collect images
        if: success()
        working-directory: /mnt/build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          OUT=out/target/product/$DEVICE_CODENAME
          for f in recovery.img boot.img vendor_boot.img; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "$GITHUB_WORKSPACE/out/"
          done
          cd "$GITHUB_WORKSPACE/out"
          sha256sum *.img | tee SHA256SUMS
          ls -lh

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-${{ env.DEVICE_CODENAME }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: success() && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aera-${{ env.DEVICE_CODENAME }}-${{ github.run_number }}
          name: AERA Recovery ${{ env.DEVICE_CODENAME }} #${{ github.run_number }}
          files: out/*
